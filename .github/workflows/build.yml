name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        run: bash scripts/build.sh
      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: DualPadMapper-macOS
          path: dist/DualPadMapper-macOS.zip
      - name: Publish v1.0.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; skipping release creation."
            exit 0
          fi
          gh release create v1.0.0 \
            dist/DualPadMapper-macOS.zip \
            --target "$GITHUB_SHA" \
            --title "DualPadMapper v1.0.0" \
            --notes "Initial public release. See README for supported controllers, installation, macOS Accessibility permission, and Steam Input setup."
