name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test
        run: bash scripts/build.sh
      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: DualPadMapper-macOS
          path: dist/DualPadMapper-macOS.zip
